<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>manga_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
    z-index: 9999;
    transition: opacity 0.6s ease;
  }
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
  #splash-video {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    /* swap axes so rotated video fills the portrait viewport */
    width: 100svh;
    height: 100svw;
    min-width: 100svh;
    min-height: 100svw;
    object-fit: cover;
    filter: grayscale(100%);
    will-change: transform;
    /* hide until ready to avoid first-frame flicker */
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #splash-video.ready {
    opacity: 1;
  }
</style>
<body>
  <div id="splash">
    <video id="splash-video" autoplay muted playsinline>
      <source src="splash.mp4" type="video/mp4">
    </video>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var splashDone = false;
    function hideSplash() {
      if (splashDone) return;
      splashDone = true;
      var splash = document.getElementById('splash');
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 650);
    }
    var flutterReady = false;
    var videoEnded = false;
    var vid = document.getElementById('splash-video');

    // Show video only once it can play — avoids first-frame flicker
    vid.addEventListener('canplay', function () {
      vid.classList.add('ready');
    });

    vid.addEventListener('ended', function () {
      videoEnded = true;
      if (flutterReady) hideSplash();
    });

    window.addEventListener('flutter-first-frame', function () {
      flutterReady = true;
      if (videoEnded) hideSplash();
    });

    // Fallback: if video fails to play, hide splash after 4s
    setTimeout(function () {
      if (!splashDone) hideSplash();
    }, 6000);
  </script>
</body>
</html>
