<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>manga_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
    z-index: 9999;
    /* stay invisible until video is ready — prevents any flash of unrotated content */
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #splash.ready {
    visibility: visible;
    opacity: 1;
  }
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
  #splash-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
  }
</style>
<body>
  <div id="splash">
    <video id="splash-video" autoplay muted playsinline preload="auto">
      <source src="splash.mp4" type="video/mp4">
    </video>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var splashDone = false;
    var splash = document.getElementById('splash');
    var vid = document.getElementById('splash-video');

    function hideSplash() {
      if (splashDone) return;
      splashDone = true;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 700);
    }

    // Only show the splash once the video is fully ready to paint — no unrotated flash
    vid.addEventListener('canplaythrough', function () {
      splash.classList.add('ready');
    });

    var flutterReady = false;
    var videoEnded = false;

    vid.addEventListener('ended', function () {
      videoEnded = true;
      if (flutterReady) hideSplash();
    });

    window.addEventListener('flutter-first-frame', function () {
      flutterReady = true;
      if (videoEnded) hideSplash();
    });

    // Hard fallback
    setTimeout(function () { if (!splashDone) hideSplash(); }, 7000);
  </script>
</body>
</html>
