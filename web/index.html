<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>manga_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
    z-index: 9999;
    /* stay invisible until video is ready — prevents any flash of unrotated content */
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #splash.ready {
    visibility: visible;
    opacity: 1;
  }
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
  #splash-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #splash-video.ready {
    opacity: 1;
  }
  #tap-to-start {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
  }
  #tap-to-start img {
    width: 55%;
    max-width: 260px;
    opacity: 0.9;
  }
  #tap-to-start span {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    font-family: sans-serif;
  }
  #tap-to-start.hidden { display: none; }
</style>
<body>
  <div id="splash">
    <video id="splash-video" muted playsinline preload="auto">
      <source src="splash.mp4" type="video/mp4">
    </video>
    <div id="tap-to-start">
      <img src="icons/Icon-512.png" alt="">
      <span>TAP TO START</span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var splashDone = false;
    var splash = document.getElementById('splash');
    var vid = document.getElementById('splash-video');
    var tapOverlay = document.getElementById('tap-to-start');

    function hideSplash() {
      if (splashDone) return;
      splashDone = true;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 700);
    }

    var flutterReady = false;
    var videoEnded = false;

    vid.addEventListener('ended', function () {
      videoEnded = true;
      if (flutterReady) hideSplash();
    });

    window.addEventListener('flutter-first-frame', function () {
      flutterReady = true;
      if (videoEnded) hideSplash();
    });

    // Hard fallback
    setTimeout(function () { if (!splashDone) hideSplash(); }, 10000);

    function startVideo() {
      var promise = vid.play();
      if (promise !== undefined) {
        promise.then(function () {
          // Autoplay succeeded — hide tap overlay, show video
          tapOverlay.classList.add('hidden');
          splash.classList.add('ready');
          vid.classList.add('ready');
        }).catch(function () {
          // Autoplay blocked — show tap overlay, wait for gesture
          splash.classList.add('ready');
          tapOverlay.style.display = 'flex';
        });
      }
    }

    function onUserGesture() {
      tapOverlay.classList.add('hidden');
      vid.play().then(function () {
        vid.classList.add('ready');
      });
      document.removeEventListener('touchstart', onUserGesture);
      document.removeEventListener('click', onUserGesture);
    }

    tapOverlay.addEventListener('touchstart', onUserGesture);
    tapOverlay.addEventListener('click', onUserGesture);

    // Try autoplay immediately
    vid.addEventListener('canplaythrough', startVideo, { once: true });
    // Also try right away in case already cached
    if (vid.readyState >= 4) startVideo();
  </script>
</body>
</html>
